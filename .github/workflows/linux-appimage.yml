name: Build Linux AppImage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "python/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "Linux ONNX Runtime variant"
        required: false
        default: "cpu"
        type: choice
        options:
          - cpu
          - cuda

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    env:
      VARIANT: ${{ github.event.inputs.variant || 'cpu' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend & typecheck
        run: npm run build

      - name: Bundle Python backend (${{ env.VARIANT }})
        run: node scripts/bundle-linux.mjs --variant=${{ env.VARIANT }}

      - name: Package AppImage (${{ env.VARIANT }})
        env:
          LUMINA_LINUX_VARIANT: ${{ env.VARIANT }}
          LUMINA_LINUX_TARGET: AppImage
        run: npx electron-builder --config scripts/electron-builder.config.linux.mjs --publish never

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-linux-${{ env.VARIANT }}-appimage
          path: dist/linux-${{ env.VARIANT }}/*.AppImage
          if-no-files-found: error
          retention-days: 14
