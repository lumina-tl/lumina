name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skipped == 'false'
        run: npm ci

      - name: Build & bundle installer (DML)
        if: steps.check.outputs.skipped == 'false'
        env:
          # Signing deferred — no cert discovery in CI
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:dml

      - name: Build & bundle installer (CUDA)
        if: steps.check.outputs.skipped == 'false'
        env:
          # Signing deferred — no cert discovery in CI
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:cuda

      # Release notes come from the versioned "## [<version>]" section.
      # Falls back to generated notes if the section is missing so the release never fails.
      - name: Extract release notes
        if: steps.check.outputs.skipped == 'false'
        shell: bash
        run: |
          if node scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" .release-body.md; then
            echo "notes=file" >> "$GITHUB_OUTPUT"
          else
            echo "notes=generate" >> "$GITHUB_OUTPUT"
          fi
        id: notes

      - name: Create release
        if: steps.check.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ steps.notes.outputs.notes }}" == "file" ]]; then
            NOTES="--notes-file .release-body.md"
          else
            NOTES="--generate-notes"
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/dml/Lumina-Setup-DML-${{ steps.version.outputs.version }}.exe \
            dist/cuda/Lumina-Setup-CUDA-${{ steps.version.outputs.version }}.exe \
            dist/dml/dml.yml dist/dml/*.blockmap \
            dist/cuda/cuda.yml dist/cuda/*.blockmap \
            build/cuda-runtime.7z build/cuda-runtime.json \
            --repo "${{ github.repository }}" $NOTES \
            --title "Lumina v${{ steps.version.outputs.version }}"

  release-linux:
    needs: release
    if: needs.release.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm ci

      - name: Build & bundle Linux AppImage (CPU)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux

      - name: Upload Linux AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" \
            dist/linux-cpu/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber
