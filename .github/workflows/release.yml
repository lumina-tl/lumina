name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.skipped == 'false'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & bundle installer (DML)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:dml

      - name: Build & bundle installer (CUDA)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:cuda

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            dist/dml/Lumina-Setup-DML-*.exe
            dist/cuda/Lumina-Setup-CUDA-*.exe
            dist/dml/dml.yml
            dist/dml/*.blockmap
            dist/cuda/cuda.yml
            dist/cuda/*.blockmap
          if-no-files-found: error

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.skipped == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm ci

      - name: Build & bundle Linux AppImage (CPU)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux

      - name: Build & bundle Linux AppImage (CUDA)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux:cuda

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/linux-cpu/*.AppImage
            dist/linux-cuda/*.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-linux]
    if: needs.prepare.outputs.skipped == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist-release
          find artifacts -type f -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Extract release notes
        id: notes
        run: |
          if node scripts/extract-release-notes.mjs "${{ needs.prepare.outputs.version }}" .release-body.md; then
            echo "notes=file" >> "$GITHUB_OUTPUT"
          else
            echo "notes=generate" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.notes.outputs.notes }}" == "file" ]]; then
            NOTES="--notes-file .release-body.md"
          else
            NOTES="--generate-notes"
          fi
          gh release create "v${{ needs.prepare.outputs.version }}" \
            dist-release/* \
            --repo "${{ github.repository }}" $NOTES \
            --title "Lumina v${{ needs.prepare.outputs.version }}"
