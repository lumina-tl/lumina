<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' file: data:; font-src 'self' data: file:; connect-src 'self';"
    />
    <title>Lumina</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        /* ── Accent ── */
        --color-lumina: #e94560;
        --color-lumina-dark: #c73a52;

        /* ── 3-Layer Depth (VS Code 2026 inspired) ── */
        --color-surface-0: #0e0e10; /* Workbench — canvas, deepest */
        --color-surface-1: #1e1e1e; /* Tools — sidebar, tool panel */
        --color-surface-2: #252526; /* Actions — header, status bar */
        --color-surface-3: #333333; /* Borders, dividers */
        --color-surface-4: #3c3c3c; /* Hover borders, active indicators */

        /* ── Text Hierarchy ── */
        --color-text-primary: #d4d4d4; /* Main content */
        --color-text-secondary: #969696; /* Body, descriptions */
        --color-text-muted: #6a6a6a; /* Labels, metadata */
        --color-text-dim: #4a4a4a; /* Disabled, very subtle */
      }
    </style>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body
    class="bg-surface-0 text-text-secondary h-screen flex flex-col overflow-hidden text-xs font-sans select-none px-1.5 pb-1.5 pt-0 gap-1.5"
  >
    <!-- Header -->
    <header
      class="card card-raised flex items-center pl-3 h-8 flex-shrink-0 gap-2 drag-region rounded-t-none relative"
    >
      <h1 class="text-[0.85rem] text-lumina font-bold tracking-tight">
        Lumina
      </h1>

      <!-- Menu Bar -->
      <nav class="flex items-center gap-0.5 ml-1" id="menu-bar">
        <!-- File Menu -->
        <div class="menu-wrap" id="menu-file-wrap">
          <button class="menu-trigger" id="menu-file-trigger">File</button>
          <div class="menu-dropdown hidden" id="menu-file-dropdown">
            <button class="menu-item" id="btn-open">
              <span class="menu-item-icon"
                ><i data-lucide="folder-open" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.open"
                >Open...</span
              >
              <span class="menu-item-shortcut">Ctrl+O</span>
            </button>
            <button class="menu-item" id="btn-import">
              <span class="menu-item-icon"
                ><i data-lucide="file-plus" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.import"
                >Import Page...</span
              >
              <span class="menu-item-shortcut">Ctrl+I</span>
            </button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="btn-save" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="save" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.save"
                >Save Project</span
              >
              <span class="menu-item-shortcut">Ctrl+S</span>
            </button>
            <button class="menu-item" id="btn-save-as" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="save" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.saveAs"
                >Save Project As...</span
              >
              <span class="menu-item-shortcut">Ctrl+Shift+S</span>
            </button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="btn-export" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="image-down" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.export"
                >Export Current Image</span
              >
              <span class="menu-item-shortcut">Ctrl+E</span>
            </button>
            <button class="menu-item" id="btn-export-all" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="images" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.exportAll"
                >Export All Pages</span
              >
              <span class="menu-item-shortcut">Ctrl+Shift+E</span>
            </button>
          </div>
        </div>

        <!-- Edit Menu -->
        <div class="menu-wrap" id="menu-edit-wrap">
          <button class="menu-trigger" id="menu-edit-trigger">Edit</button>
          <div class="menu-dropdown hidden" id="menu-edit-dropdown">
            <button class="menu-item" id="btn-undo" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="undo-2" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.undo">Undo</span>
              <span class="menu-item-shortcut">Ctrl+Z</span>
            </button>
            <button class="menu-item" id="btn-redo" disabled>
              <span class="menu-item-icon"
                ><i data-lucide="redo-2" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="header.redo">Redo</span>
              <span class="menu-item-shortcut">Ctrl+Y</span>
            </button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="menu-settings">
              <span class="menu-item-icon"
                ><i data-lucide="settings" class="w-3.5 h-3.5"></i
              ></span>
              <span class="menu-item-label" data-i18n="settings.title"
                >Preferences / Settings</span
              >
              <span class="menu-item-shortcut">Ctrl+,</span>
            </button>
          </div>
        </div>
      </nav>

      <div id="paint-options" class="hidden paint-options">
        <label class="paint-opt paint-opt-color" title="Color">
          <span class="paint-opt-label" data-i18n="paint.color">Color</span>
          <input type="color" id="paint-color" value="#111111" />
        </label>
        <div class="paint-opt paint-opt-size" title="Size">
          <label for="paint-size" class="paint-opt-label" data-i18n="paint.size"
            >Size</label
          >
          <input type="range" id="paint-size" min="2" max="300" value="24" />
          <div class="paint-opt-val-wrap">
            <input
              type="number"
              class="paint-opt-input"
              id="paint-size-value"
              min="2"
              max="300"
              value="24"
            />
            <span class="paint-opt-unit">px</span>
          </div>
        </div>
        <div class="paint-opt paint-opt-opacity" title="Opacity">
          <label
            for="paint-opacity"
            class="paint-opt-label"
            data-i18n="paint.opacity"
            >Opacity</label
          >
          <input
            type="range"
            id="paint-opacity"
            min="0"
            max="100"
            value="100"
          />
          <div class="paint-opt-val-wrap">
            <input
              type="number"
              class="paint-opt-input"
              id="paint-opacity-value"
              min="0"
              max="100"
              value="100"
            />
            <span class="paint-opt-unit">%</span>
          </div>
        </div>
        <div class="paint-opt paint-opt-hardness" title="Hardness">
          <label
            for="paint-hardness"
            class="paint-opt-label"
            data-i18n="paint.hardness"
            >Hardness</label
          >
          <input
            type="range"
            id="paint-hardness"
            min="0"
            max="100"
            value="50"
          />
          <div class="paint-opt-val-wrap">
            <input
              type="number"
              class="paint-opt-input"
              id="paint-hardness-value"
              min="0"
              max="100"
              value="50"
            />
            <span class="paint-opt-unit">%</span>
          </div>
        </div>
        <div class="paint-opt paint-opt-tolerance" title="Tolerance">
          <label
            for="paint-tolerance"
            class="paint-opt-label"
            data-i18n="paint.tolerance"
            >Tolerance</label
          >
          <input
            type="range"
            id="paint-tolerance"
            min="0"
            max="255"
            value="32"
          />
          <div class="paint-opt-val-wrap">
            <input
              type="number"
              class="paint-opt-input"
              id="paint-tolerance-value"
              min="0"
              max="255"
              value="32"
            />
          </div>
        </div>
        <label class="paint-opt paint-opt-contiguous" title="Contiguous">
          <input type="checkbox" id="paint-contiguous" checked />
          <span data-i18n="paint.contiguous">Contiguous</span>
        </label>
        <span class="paint-opt paint-opt-hint" data-i18n="paint.eyedropperHint"
          >Click to sample — returns to previous tool</span
        >
        <button
          class="paint-opt-reset"
          id="paint-reset"
          data-i18n-title="paint.reset"
          title="Reset to defaults"
        >
          <i data-lucide="rotate-ccw"></i>
        </button>
      </div>

      <!-- Header Dynamic Island (Status & Notification Capsule) -->
      <div id="dynamic-island" class="dynamic-island hidden">
        <div class="dynamic-island-content">
          <i class="dynamic-island-icon" data-lucide="info"></i>
          <span class="dynamic-island-text" id="dynamic-island-text"></span>
        </div>
        <div class="dynamic-island-actions" id="dynamic-island-actions"></div>
      </div>

      <div class="flex gap-1.5 ml-auto items-center">
        <button
          class="btn relative"
          id="btn-update"
          hidden
          data-i18n-title="header.update"
        >
          <i data-lucide="cloud-download" class="w-3 h-3"></i>
          <span
            class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-lumina"
            title=""
          ></span>
        </button>
        <button
          class="btn"
          id="btn-models"
          hidden
          data-i18n-title="models.openShortcut"
        >
          <i data-lucide="alert-triangle" class="w-3 h-3 text-[#ffb74d]"></i>
        </button>
        <button
          class="btn hidden"
          id="btn-pipeline-restore"
          title="Show Pipeline Toolbar"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-lumina"></i>
          <span class="text-xs font-medium">Pipeline</span>
        </button>
        <button class="btn" id="btn-settings" data-i18n-title="settings.title">
          <i data-lucide="settings" class="w-3 h-3"></i>
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="flex flex-1 overflow-hidden gap-1.5" id="workspace">
      <!-- Left: Tools Panel -->
      <div
        class="card w-12 flex flex-col items-center py-1.5 gap-0.5 flex-shrink-0"
        id="tools-panel"
      >
        <!-- Populated by tools.js -->
      </div>

      <!-- Center column: canvas above, page navigation below (canvas width only) -->
      <div class="flex-1 min-w-0 flex flex-col gap-1.5">
        <!-- Center: Single Canvas -->
        <div
          class="card card-raised flex-1 relative overflow-hidden bg-surface-0"
          id="canvas-area"
        >
          <!-- Landing (welcome screen — content built by lib/landing.ts) -->
          <div id="landing" class="z-10"></div>

          <!-- Floating Draggable Pipeline Bar -->
          <div id="pipeline-bar" class="pipeline-bar hidden">
            <div class="pipeline-bar-pill">
              <!-- Drag Handle -->
              <div class="pipeline-drag-handle" title="Drag to move">
                <i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>
              </div>

              <!-- Detect Action + Expandable Model Selector -->
              <div class="pipeline-group" data-kind="detect">
                <button
                  class="pipeline-btn"
                  id="btn-detect"
                  disabled
                  title="Detect text"
                >
                  <i data-lucide="scan" class="w-3.5 h-3.5"></i>
                  <span data-i18n="header.detect">Detect</span>
                </button>
                <button
                  class="pipeline-chevron"
                  id="btn-detect-model"
                  title="Select Detect Model"
                >
                  <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div
                  class="pipeline-dropdown hidden"
                  id="dropdown-detect"
                ></div>
              </div>

              <!-- OCR Action + Expandable Model Selector -->
              <div class="pipeline-group" data-kind="ocr">
                <button
                  class="pipeline-btn"
                  id="btn-ocr"
                  disabled
                  title="Run OCR"
                >
                  <i data-lucide="scan-text" class="w-3.5 h-3.5"></i>
                  <span data-i18n="header.ocr">OCR</span>
                </button>
                <button
                  class="pipeline-chevron"
                  id="btn-ocr-model"
                  title="Select OCR Model"
                >
                  <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div class="pipeline-dropdown hidden" id="dropdown-ocr"></div>
              </div>

              <!-- Translate Action + Expandable Model Selector -->
              <div class="pipeline-group" data-kind="translate">
                <button
                  class="pipeline-btn"
                  id="btn-translate"
                  disabled
                  title="Translate text"
                >
                  <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                  <span data-i18n="header.translate">Translate</span>
                </button>
                <button
                  class="pipeline-chevron"
                  id="btn-translate-model"
                  title="Select Translation Provider"
                >
                  <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div
                  class="pipeline-dropdown hidden"
                  id="dropdown-translate"
                ></div>
              </div>

              <!-- Inpaint Action + Expandable Model Selector -->
              <div class="pipeline-group" data-kind="inpaint">
                <button
                  class="pipeline-btn"
                  id="btn-inpaint"
                  disabled
                  title="Inpaint text boxes"
                >
                  <i data-lucide="eraser" class="w-3.5 h-3.5"></i>
                  <span data-i18n="header.inpaint">Inpaint</span>
                </button>
                <button
                  class="pipeline-chevron"
                  id="btn-inpaint-model"
                  title="Select Inpaint Model"
                >
                  <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div
                  class="pipeline-dropdown hidden"
                  id="dropdown-inpaint"
                ></div>
              </div>

              <div class="pipeline-sep"></div>

              <!-- Run Preset (split button) -->
              <div class="pipeline-group pipeline-preset-group">
                <button
                  class="pipeline-btn pipeline-btn-all"
                  id="btn-pipeline-all"
                  title="Run pipeline preset"
                >
                  <i data-lucide="play" class="w-3.5 h-3.5"></i>
                  <span id="btn-pipeline-all-label">Full Pipeline</span>
                </button>
                <button
                  class="pipeline-chevron"
                  id="btn-pipeline-preset-chevron"
                  title="Choose pipeline preset"
                >
                  <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div
                  class="pipeline-dropdown pipeline-preset-dropdown hidden"
                  id="dropdown-preset"
                ></div>
              </div>

              <!-- Toggle Boxes -->
              <button
                class="pipeline-icon-btn"
                id="btn-toggle-boxes"
                disabled
                data-i18n-title="header.toggleBoxes"
              >
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              </button>

              <!-- Minimize Toggle -->
              <button
                class="pipeline-icon-btn"
                id="btn-pipeline-minimize"
                title="Minimize toolbar"
              >
                <i data-lucide="minus" class="w-3.5 h-3.5"></i>
              </button>
            </div>

            <!-- Pipeline Docked Sub-Capsule -->
            <div id="pipeline-sub-capsule" class="pipeline-sub-capsule hidden">
              <i class="sub-capsule-icon" data-lucide="info"></i>
              <span class="sub-capsule-text" id="pipeline-sub-text"></span>
              <div class="sub-capsule-actions" id="pipeline-sub-actions"></div>
            </div>
          </div>

          <!-- Single Konva container -->
          <div id="canvas-container" class="absolute inset-0"></div>

          <!-- Page indicator -->
          <div
            id="page-indicator"
            class="absolute top-2 right-2 z-20 text-[0.65rem] text-text-muted hidden"
          ></div>

          <!-- Zoom controls -->
          <div id="zoom-controls" class="absolute bottom-2 left-2 z-20 hidden">
            <div
              class="flex items-center bg-surface-1 border border-surface-3 rounded overflow-hidden"
            >
              <button
                id="btn-zoom-out"
                class="zoom-btn"
                data-i18n-title="zoom.zoomOut"
              >
                <i data-lucide="minus" class="w-3 h-3"></i>
              </button>
              <span
                id="zoom-value"
                class="px-2 font-mono text-[0.65rem] text-text-secondary select-none"
                >100%</span
              >
              <button
                id="btn-zoom-fit"
                class="zoom-btn"
                data-i18n-title="zoom.fit"
              >
                <i data-lucide="maximize" class="w-3 h-3"></i>
              </button>
              <button
                id="btn-zoom-in"
                class="zoom-btn"
                data-i18n-title="zoom.zoomIn"
              >
                <i data-lucide="plus" class="w-3 h-3"></i>
              </button>
            </div>
          </div>

          <!-- Progress overlay -->
          <div id="progress-overlay" class="overlay">
            <div
              class="text-text-secondary text-xs mb-2"
              id="progress-title"
              data-i18n="progress.processing"
            >
              Processing...
            </div>
            <div id="progress-steps"></div>
          </div>
        </div>

        <!-- Page Strip (page navigation) — spans only the canvas width and
             butts against the sidebar; the sidebar stays full height. -->
        <div
          id="page-strip"
          class="flex-shrink-0 overflow-x-auto custom-scrollbar hidden"
        >
          <div
            id="page-strip-items"
            class="flex gap-2 px-3 py-2 h-full items-center"
          ></div>
        </div>
      </div>

      <!-- Right: Sidebar -->
      <div
        class="card w-[260px] flex flex-col flex-shrink-0 overflow-hidden relative"
        id="sidebar"
      >
        <div class="sidebar-resize" id="sidebar-resize"></div>
        <div
          class="flex-1 min-h-0 flex flex-col overflow-hidden custom-scrollbar"
          id="sidebar-scroll"
        >
          <!-- Populated by sidebar.js -->
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div
      class="card flex items-center px-3 h-6 flex-shrink-0 text-[0.65rem] text-text-muted gap-3"
    >
      <span id="status-zoom">100%</span>
      <span class="w-px h-3 bg-surface-3"></span>
      <span id="status-tool" data-i18n="tools.selectName">Select</span>
      <span class="w-px h-3 bg-surface-3"></span>
      <span id="status-detections" data-i18n="status.noDetections"
        >No detections</span
      >
      <span id="status-project" class="ml-auto"></span>
      <span id="status-page"></span>
    </div>

    <!-- Settings Modal (tab content built by lib/settings/) -->
    <div id="settings-overlay" class="overlay">
      <div
        class="card card-raised settings-modal flex flex-col overflow-hidden"
        id="settings-modal"
      >
        <div
          class="settings-titlebar flex items-center justify-between px-4 py-3 border-b border-surface-3"
          id="settings-titlebar"
        >
          <h3
            class="text-text-primary text-xs font-semibold"
            data-i18n="settings.title"
          >
            Settings
          </h3>
          <button class="btn p-1" id="btn-settings-close">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <!-- Nav + panes are built by settings.init() -->
        <div class="flex flex-1 min-h-0" id="settings-body">
          <div id="settings-tabbar" class="settings-nav"></div>
          <div
            id="settings-panes"
            class="flex flex-col flex-1 min-h-0 overflow-hidden"
          ></div>
        </div>
        <div class="flex justify-end gap-2 px-4 py-3 border-t border-surface-3">
          <button
            class="btn hidden"
            id="btn-shortcuts-reset-all"
            data-i18n="shortcuts.resetAll"
          >
            Reset All
          </button>
          <button
            class="btn primary"
            id="btn-settings-done"
            data-i18n="shortcuts.done"
          >
            Done
          </button>
        </div>
        <div
          class="settings-resize-grip"
          id="settings-resize-grip"
          title="Resize"
        >
          <i data-lucide="grip" class="w-3 h-3"></i>
        </div>
      </div>
    </div>

    <!-- Bundled renderer (esbuild output) -->
    <script src="../../dist/renderer/bundle.js"></script>
  </body>
</html>
